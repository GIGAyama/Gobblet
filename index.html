<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- ① インストールの合図を「いちばん先に」受け取る。
       Chrome は条件が揃うと即座に beforeinstallprompt を出すため、
       本体スクリプトより後だと合図を取りこぼし、通信が遅い端末で
       「インストール」ボタンが出なくなる。 -->
  <script src="./js/pwa-install.js"></script>

  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <!-- 通信先も読み込み先も自分自身だけ。外部CDN・外部フォント・外部通信は一切ない。 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="theme-color" content="#1769aa">
  <meta name="color-scheme" content="light">
  <meta name="description" content="大きな駒で小さな駒をかぶせて3つ並べる、2人対戦ボードゲーム">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ゴブレット">
  <title>パクパクゴブレット</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
  <!-- iOS は maskable 非対応。専用の四角いアイコンを渡す -->
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header>
    <h1>パクパクゴブレット</h1>
    <div class="actions">
      <button id="install" class="btn install" type="button">インストール</button>
      <button id="sound" class="btn" type="button" aria-pressed="true" aria-label="音を消す"><span class="sound-icon" aria-hidden="true">🔊</span><span class="sound-label">ON</span></button>
      <button id="fullscreen" class="btn icon-btn" type="button" aria-pressed="false" aria-label="大きく表示（電子黒板用）">⛶</button>
      <button id="rules" class="btn icon-btn" type="button" aria-label="遊び方">？</button>
    </div>
  </header>

  <main>
    <section class="game" aria-label="ゲーム盤">
      <div class="hand-block p2">
        <span class="label p2">ブルー（P2）</span>
        <div id="p2-hand" class="hand" aria-label="ブルーの手持ち駒"></div>
      </div>
      <div class="center">
        <div class="board-shell">
          <div class="board-frame">
            <div id="board" class="board" role="grid" aria-label="3かける3のゲーム盤"></div>
          </div>
        </div>
        <div class="controls">
          <div id="turn" class="turn" aria-live="polite"></div>
          <button id="reset" class="btn reset" type="button">最初から</button>
        </div>
      </div>
      <div class="hand-block p1">
        <div id="p1-hand" class="hand" aria-label="オレンジの手持ち駒"></div>
        <span class="label p1">オレンジ（P1）</span>
      </div>
    </section>
  </main>

  <footer>© 2026 パクパクゴブレット GIGA山</footer>

  <dialog id="rules-dialog">
    <div class="dialog-body">
      <h2>あそびかた</h2>
      <div class="rules">
        <div class="rule"><b>1. 大きい駒でパクッ！</b><br>大きい駒は、小さい駒の上にかぶせられます。</div>
        <div class="rule"><b>2. 3つ並べたら勝ち！</b><br>自分の色を、たて・よこ・ななめに3つ並べます。</div>
        <div class="rule"><b>3. 盤上の駒も動かせる！</b><br>ただし、下の駒が現れて相手が3つ並んだら、その時点で相手の勝ちです。</div>
      </div>
    </div>
    <div class="dialog-actions">
      <button class="btn primary close-dialog" type="button">わかった！</button>
    </div>
  </dialog>

  <dialog id="message-dialog">
    <div class="dialog-body">
      <h2 id="message-title"></h2>
      <p id="message-text"></p>
    </div>
    <div class="dialog-actions">
      <button id="message-ok" class="btn primary" type="button">OK</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="update-bar" class="update-bar" role="status" aria-live="polite">
    <span>あたらしい バージョンが あります</span>
    <button id="update-apply" class="btn" type="button">さいしんに する</button>
  </div>

  <script src="./js/rules.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
