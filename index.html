<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>パクパクゴブレット</title>
  
  <!-- PWA Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <link rel="apple-touch-icon" href="favicon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="favicon.png">
  <!-- CSS読み込み -->
  <style>
    /* ================================================================
     * 1. 基本設定 & フォント
     * ================================================================ */
    /* Google Fonts: Zen Maru Gothic (丸文字で優しい雰囲気) */
    @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

    :root {
      /* カラーパレット */
      --primary-color: #1a73e8;       /* Google Blue */
      --accent-color: #ffca28;        /* Amber (楽しさ) */
      --text-color: #5d4037;          /* 濃い茶色 (目に優しい) */
      
      /* プレイヤーカラー */
      --p1-color: #ff7043;            /* オレンジ (P1) */
      --p1-shadow: #d84315;
      --p2-color: #42a5f5;            /* ブルー (P2) */
      --p2-shadow: #1565c0;

      /* 盤面カラー */
      --board-bg: #8d6e63;
      --cell-bg: #fff3e0;
    }

    html, body {
      height: 100%; /* 画面の高さを100%に固定 */
      margin: 0;
      padding: 0;
      overflow: hidden; /* スクロールを禁止 */
    }

    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      color: var(--text-color);
      /* GIGA Game Standard 背景規定 */
      background-color: #fff9c4;
      background-image: radial-gradient(#ffe082 20%, transparent 20%), radial-gradient(#ffe082 20%, transparent 20%);
      background-position: 0 0, 25px 25px;
      background-size: 50px 50px;
      
      display: flex;
      flex-direction: column; /* 縦並びのレイアウト */
    }

    /* ふりがな (rt) の視認性向上 */
    rt {
      font-size: 0.65em;
      color: #8d6e63;
      font-weight: 500;
    }

    /* ================================================================
     * 2. UIコンポーネント
     * ================================================================ */
    .pop-btn {
      border: none;
      font-weight: 900;
      letter-spacing: 0.05em;
      transition: transform 0.1s, box-shadow 0.1s;
      border-radius: 50rem;
      position: relative;
      overflow: hidden;
    }

    .pop-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px rgba(0,0,0,0.15) !important;
    }

    .pop-btn:active {
      transform: scale(0.92) !important;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1) !important;
    }

    /* ヘッダーエリア */
    header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(5px);
      border-bottom: 3px solid var(--accent-color);
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      flex-shrink: 0; /* 縮小しない */
      z-index: 10;
    }

    .app-title {
      font-weight: 900;
      color: var(--primary-color);
      text-shadow: 2px 2px 0px #fff;
      margin: 0;
    }

    /* メインエリア (ここが伸縮して画面に収める) */
    main {
      flex: 1; /* 残りの高さを全て使う */
      display: flex;
      flex-direction: column;
      justify-content: center; /* 縦方向中央寄せ */
      align-items: center;
      overflow: hidden;
      padding: 5px;
      width: 100%;
    }

    /* ゲームコンテナ */
    .game-container {
      width: 100%;
      max-width: 600px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly; /* 要素を均等に配置 */
      align-items: center;
      position: relative;
    }

    .hand-wrapper {
      width: 100%;
    }

    .board-wrapper-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    /* フッター */
    footer {
      background: rgba(255, 255, 255, 0.9);
      flex-shrink: 0; /* 縮小しない */
      z-index: 10;
      width: 100%;
    }

    /* ================================================================
     * 3. ゲーム盤 (サイズ自動調整)
     * ================================================================ */
    .board-wrapper {
      background: var(--board-bg);
      padding: 10px;
      border-radius: 20px;
      box-shadow: 0 5px 0 #5d4037, 0 10px 15px rgba(0,0,0,0.2);
      
      /* 重要: 画面サイズに合わせて調整 */
      width: 100%;
      max-width: min(90vw, 46vh); /* 縦画面でも収まるように高さ基準で制限、横幅も考慮 */
      aspect-ratio: 1 / 1; /* 正方形を維持 */
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 1; /* 画面が狭いときは縮む */
      min-height: 0; /* Flexbox内での縮小を許可 */
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      height: 100%;
    }

    .cell {
      background-color: var(--cell-bg);
      border-radius: 12px;
      position: relative;
      cursor: pointer;
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .cell:active {
      background-color: #ddd; /* タッチした瞬間のフィードバック */
    }

    .cell:hover {
      background-color: #fff;
    }

    .cell.win-line {
      animation: flash-win 1s infinite alternate;
    }

    /* ================================================================
     * 4. 駒 & 手札エリア (サイズ自動調整)
     * ================================================================ */
    .piece {
      position: absolute;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(2px 3px 2px rgba(0,0,0,0.3));
      pointer-events: none;
      z-index: 1;
      width: 80%; /* 親要素に対して相対サイズ */
      height: 80%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    /* SVG自体もレスポンシブに */
    .piece svg {
      width: 100%;
      height: 100%;
    }

    .piece.selected {
      z-index: 100;
      animation: bounce-select 0.8s infinite;
      filter: drop-shadow(0 5px 10px var(--accent-color));
    }
    
    .hand-area .piece {
      position: relative;
      cursor: grab;
      pointer-events: auto;
      margin: 2px;
      width: 50px; /* 手札内の基本サイズ */
      height: 50px;
    }
    
    /* 手札のサイズ微調整 */
    .hand-area .piece[data-size="2"] { width: 60px; height: 60px; } /* 大 */
    .hand-area .piece[data-size="1"] { width: 45px; height: 45px; } /* 中 */
    .hand-area .piece[data-size="0"] { width: 35px; height: 35px; } /* 小 */

    .hand-area {
      background: rgba(255, 255, 255, 0.6);
      border-radius: 15px;
      width: 100%;
      
      /* 高さの自動調整 */
      height: 12vh; 
      min-height: 70px;
      max-height: 120px;
      
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      border: 3px dashed rgba(0,0,0,0.1);
      transition: background-color 0.3s;
      padding: 5px;
      flex-shrink: 0; /* 手札エリアは潰れすぎないように */
    }

    .hand-area.active-turn {
      background: rgba(255, 255, 255, 0.95);
      border-color: var(--accent-color);
      box-shadow: 0 0 15px var(--accent-color);
    }

    .p1-bg { background-color: #ffccbc; }
    .p2-bg { background-color: #bbdefb; }

    /* ターン表示エリア */
    .turn-info-container {
        flex-shrink: 0;
        margin-top: 1vh;
    }

    /* ================================================================
     * 5. アニメーション & レスポンシブ (Landscape)
     * ================================================================ */
    @keyframes bounce-select {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-10px) scale(1.1); }
    }

    @keyframes flash-win {
      from { background-color: #fff59d; }
      to { background-color: #ffd54f; }
    }

    .gobble-anim {
      animation: gobble-effect 0.4s ease-out;
    }

    @keyframes gobble-effect {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    /* タブレット・横向きPC・回転スマートフォン向けの高度なレイアウト調整 */
    @media (orientation: landscape) and (min-width: 576px) {
      .game-container {
        max-width: 1000px;
        flex-direction: row !important;
        justify-content: space-around;
        align-items: center;
        height: 100%;
        width: 100%;
        padding: 10px;
      }

      .hand-wrapper {
        width: 140px !important;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .hand-wrapper-p2 {
        order: 1;
      }

      .board-wrapper-container {
        order: 2;
        flex: 1;
        max-width: 55vh;
        margin: 0 20px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .hand-wrapper-p1 {
        order: 3;
      }

      .board-wrapper {
        max-width: 100%;
        width: 100%;
        aspect-ratio: 1 / 1;
      }

      .hand-area {
        flex-direction: column !important;
        height: 60vh !important;
        min-height: 250px !important;
        max-height: 450px !important;
        width: 110px !important;
        justify-content: space-around !important;
        padding: 10px !important;
      }

      .p2-badge-container {
        margin-bottom: 8px !important;
        justify-content: center !important;
        width: 100%;
      }

      .p1-badge-container {
        margin-top: 8px !important;
        justify-content: center !important;
        width: 100%;
      }

      /* 横画面でのターンインジケーターの配置調整 */
      .turn-info-container {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: auto;
        z-index: 20;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1) !important;
      }
    }

    /* 小さい画面(スマホ横向き等)の微調整 */
    @media (max-height: 600px) {
        .app-title { font-size: 1rem; }
        header { padding: 2px !important; }
        .hand-area { height: 12vh; min-height: 50px; }
        .board-wrapper { max-width: 40vh; padding: 5px; }
        footer { padding: 2px !important; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <!-- 1. ヘッダー -->
  <header class="d-flex justify-content-between align-items-center py-2 px-3">
    <div class="d-flex align-items-center">
      <h1 class="app-title h5 mb-0 me-2">パクパクゴブレット</h1>
    </div>
    <div class="d-flex align-items-center">
      <button id="install-btn" class="btn btn-sm btn-success rounded-pill me-1 fw-bold border-0 shadow-sm" style="font-size: 0.75rem; display: none;">
        📥 インストール
      </button>
      <button id="sound-btn" class="btn btn-sm btn-light rounded-pill me-1 fw-bold text-primary border-0 shadow-sm" style="font-size: 0.75rem;">
        🔊 ON
      </button>
      <button id="rule-btn" class="pop-btn btn btn-warning rounded-circle text-white fw-bold shadow-sm" style="width: 38px; height: 38px; padding: 0; font-size: 1.2rem;">
        ？
      </button>
    </div>
  </header>

  <!-- 2. メインゲームエリア (1画面に収める) -->
  <main>
    <div class="game-container">
      
      <!-- 相手(P2) 手札ブロック -->
      <div class="hand-wrapper hand-wrapper-p2">
        <div class="d-flex justify-content-between align-items-end mb-1 px-2 p2-badge-container">
           <span class="badge rounded-pill text-bg-primary fs-6 shadow-sm" style="font-size:0.75rem;">ブルー (P2)</span>
        </div>
        <div id="p2-hand" class="hand-area p2-bg shadow-inner"></div>
      </div>

      <!-- ゲーム盤 ブロック -->
      <div class="board-wrapper-container">
        <div class="board-wrapper">
          <div id="game-board" class="board"></div>
        </div>
      </div>

      <!-- 自分(P1) 手札ブロック -->
      <div class="hand-wrapper hand-wrapper-p1">
        <div id="p1-hand" class="hand-area p1-bg shadow-inner"></div>
        <div class="d-flex justify-content-between align-items-start mt-1 px-2 p1-badge-container">
           <span class="badge rounded-pill text-bg-danger fs-6 shadow-sm" style="font-size:0.75rem;">オレンジ (P1)</span>
        </div>
      </div>

      <!-- 操作パネル ブロック -->
      <div class="turn-info-container text-center bg-white bg-opacity-75 rounded-4 shadow-sm px-4 py-2">
        <div id="turn-indicator" class="fw-bold text-dark mb-1" style="font-size:1.1rem;"></div>
        <button id="reset-btn" class="pop-btn btn btn-outline-danger btn-sm px-3 fw-bold rounded-pill" style="font-size:0.8rem;">
          <ruby>最初<rt>さいしょ</rt></ruby>から
        </button>
      </div>

    </div>
  </main>

  <!-- 3. フッター (固定) -->
  <footer class="text-center text-muted py-2 border-top bg-white">
    <small style="font-size:0.7rem;">© 2026 パクパクゴブレット <a href="https://note.com/cute_borage86" target="_blank" class="text-decoration-none text-muted">GIGA山</a></small>
  </footer>

  <!-- JS読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
  /**
   * ================================================================
   * パクパクゴブレット - ゲームロジック (GIGA Standard Ver.7)
   * ================================================================
   */

  // --- 1. 定数と設定 ---
  const BOARD_SIZE = 3;
  const PLAYERS = { P1: 'p1', P2: 'p2' };
  const PLAYER_NAMES = { [PLAYERS.P1]: 'オレンジ', [PLAYERS.P2]: 'ブルー' };
  const PLAYER_COLORS = { [PLAYERS.P1]: '#ff7043', [PLAYERS.P2]: '#42a5f5' };
  const SIZES = { SMALL: 0, MEDIUM: 1, LARGE: 2 }; 
  const SIZE_NAMES = ['小', '中', '大'];

  // --- 2. ゲーム状態 ---
  let state = {
    board: [],      // 3x3の配列 (各セルはスタック)
    hands: {},      // プレイヤーの手持ち駒
    turn: null,     // 現在のターン
    selected: null, // 選択中の駒 { type: 'hand'|'board', player, size, row, col, index }
    isGameOver: false,
    soundEnabled: true
  };

  // --- 3. 音声合成 (Web Audio API) ---
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playTone(type) {
    if (!state.soundEnabled) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    
    if (type === 'select') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    } else if (type === 'place') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    } else if (type === 'gobble') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.linearRampToValueAtTime(400, now + 0.1);
      osc.frequency.linearRampToValueAtTime(100, now + 0.2);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
    } else if (type === 'win') {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g);
        g.connect(audioCtx.destination);
        o.type = 'triangle';
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.2, now + i * 0.1);
        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.4);
        o.start(now + i * 0.1);
        o.stop(now + i * 0.1 + 0.4);
      });
    } else if (type === 'error') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.linearRampToValueAtTime(100, now + 0.2);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
    }
  }

  // --- 4. 初期化処理 ---
  function generateId() {
    return Math.random().toString(36).substring(2, 11) + Date.now().toString(36);
  }

  function initGame() {
    state.board = Array(BOARD_SIZE).fill(null).map(() => 
      Array(BOARD_SIZE).fill(null).map(() => [])
    );

    const initialHand = [];
    [SIZES.SMALL, SIZES.MEDIUM, SIZES.LARGE].forEach(s => {
      initialHand.push({ size: s, id: generateId() });
      initialHand.push({ size: s, id: generateId() });
    });
    
    state.hands = {
      [PLAYERS.P1]: [...initialHand], 
      [PLAYERS.P2]: [...initialHand]
    };

    state.turn = PLAYERS.P1;
    state.selected = null;
    state.isGameOver = false;

    renderAll();
    updateTurnDisplay();
  }

  // --- 5. 描画ロジック (SVG生成 - 基準サイズ100で統一) ---
  function createPieceSVG(player, size, isSelected = false) {
    const color = PLAYER_COLORS[player];
    const sizePx = 100;
    
    const mouthOpen = isSelected ? 15 : 4;
    const eyeOffset = sizePx * 0.25;
    const eyeSize = sizePx * 0.08;

    return `
      <svg width="100%" height="100%" viewBox="0 0 ${sizePx} ${sizePx}" class="piece-svg" style="display:block;">
        <circle cx="${sizePx/2}" cy="${sizePx/2}" r="${sizePx/2 - 2}" fill="${color}" stroke="#fff" stroke-width="4" />
        <circle cx="${sizePx/2 - eyeOffset}" cy="${sizePx/2 - 10}" r="${eyeSize+3}" fill="white" />
        <circle cx="${sizePx/2 + eyeOffset}" cy="${sizePx/2 - 10}" r="${eyeSize+3}" fill="white" />
        <circle cx="${sizePx/2 - eyeOffset}" cy="${sizePx/2 - 10}" r="${eyeSize}" fill="#333" />
        <circle cx="${sizePx/2 + eyeOffset}" cy="${sizePx/2 - 10}" r="${eyeSize}" fill="#333" />
        <ellipse cx="${sizePx/2}" cy="${sizePx/2 + 15}" rx="${sizePx * 0.15}" ry="${mouthOpen}" fill="#333" />
      </svg>
    `;
  }

  function renderAll() {
    renderBoard();
    renderHands();
  }

  function renderBoard() {
    const boardEl = document.getElementById('game-board');
    boardEl.innerHTML = '';

    state.board.forEach((row, rIndex) => {
      row.forEach((stack, cIndex) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.row = rIndex;
        cell.dataset.col = cIndex;
        cell.onclick = () => handleCellClick(rIndex, cIndex);

        if (stack.length > 0) {
          const topPiece = stack[stack.length - 1];
          const pieceDiv = document.createElement('div');
          pieceDiv.className = 'piece';
          pieceDiv.dataset.size = topPiece.size;
          
          const scaleMap = ['45%', '65%', '85%'];
          pieceDiv.style.width = scaleMap[topPiece.size];
          pieceDiv.style.height = scaleMap[topPiece.size];
          
          if (state.selected && state.selected.type === 'board' && 
              state.selected.row === rIndex && state.selected.col === cIndex) {
            pieceDiv.classList.add('selected');
            pieceDiv.innerHTML = createPieceSVG(topPiece.player, topPiece.size, true);
          } else {
            pieceDiv.innerHTML = createPieceSVG(topPiece.player, topPiece.size, false);
          }
          cell.appendChild(pieceDiv);
        }
        boardEl.appendChild(cell);
      });
    });
  }

  function renderHands() {
    [PLAYERS.P1, PLAYERS.P2].forEach(p => {
      const container = document.getElementById(`${p}-hand`);
      container.innerHTML = '';
      
      if (state.turn === p) container.classList.add('active-turn');
      else container.classList.remove('active-turn');

      const pieces = state.hands[p].sort((a, b) => a.size - b.size);

      pieces.forEach((piece, index) => {
        const pieceWrapper = document.createElement('div');
        pieceWrapper.className = 'piece';
        pieceWrapper.dataset.size = piece.size;
        
        const isSelected = (state.selected && state.selected.type === 'hand' && 
                            state.selected.player === p && state.selected.index === index);
        
        if (isSelected) pieceWrapper.classList.add('selected');
        
        pieceWrapper.innerHTML = createPieceSVG(p, piece.size, isSelected);
        
        pieceWrapper.onclick = (e) => {
            e.stopPropagation();
            handleHandPieceClick(p, index, piece.size);
        };
        container.appendChild(pieceWrapper);
      });
    });
  }

  function updateTurnDisplay() {
    const indicator = document.getElementById('turn-indicator');
    const name = PLAYER_NAMES[state.turn];
    indicator.innerHTML = `<span style="color:${PLAYER_COLORS[state.turn]}">●</span> ${name} のばん`;
  }

  // --- 6. 操作ハンドリング ---

  function selectBoardPiece(row, col, piece) {
      state.selected = { type: 'board', player: piece.player, size: piece.size, row, col };
      playTone('select');
      renderAll();
  }

  function handleHandPieceClick(player, index, size) {
    if (state.isGameOver) return;
    if (player !== state.turn) {
      playTone('error'); return;
    }
    // トグル選択解除の追加
    if (state.selected && state.selected.type === 'hand' && 
        state.selected.player === player && state.selected.index === index) {
      state.selected = null;
    } else {
      state.selected = { type: 'hand', player, size, index };
    }
    playTone('select');
    renderAll(); 
  }

  function handleCellClick(row, col) {
    if (state.isGameOver) return;
    const stack = state.board[row][col];
    const topPiece = stack.length > 0 ? stack[stack.length - 1] : null;

    // 1. クリックした場所に「自分のコマ」がある場合 (最優先)
    if (topPiece && topPiece.player === state.turn) {
        if (!state.selected) {
            selectBoardPiece(row, col, topPiece);
            return;
        }
        if (state.selected.type === 'board' && state.selected.row === row && state.selected.col === col) {
            state.selected = null;
            playTone('select'); 
            renderAll();
            return;
        }
        if (state.selected.size <= topPiece.size) {
            selectBoardPiece(row, col, topPiece);
            return;
        }
    }

    // 2. 相手のコマをクリックした場合
    if (!state.selected && topPiece && topPiece.player !== state.turn) {
        playTone('error');
        Swal.fire({
            icon: 'warning',
            title: 'ちがうよ！',
            html: 'あいての コマは <ruby>動<rt>うご</rt></ruby>かせないよ', // ルビ追加
            timer: 1500,
            showConfirmButton: false,
            heightAuto: false
        });
        return;
    }

    // 3. 移動・配置処理
    if (state.selected) {
        if (topPiece && topPiece.size >= state.selected.size) {
            playTone('error');
            Swal.fire({
                icon: 'error',
                title: 'おけないよ！', // 漢字をひらがなに
                html: 'そこには <b>もっと<ruby>大<rt>おお</rt></ruby>きい</b> コマがあるよ。<br><ruby>大<rt>おお</rt></ruby>きいコマなら かぶせられるよ！', // ルビ追加
                timer: 2000,
                showConfirmButton: false,
                heightAuto: false
            });
            return;
        }

        // 移動実行
        if (state.selected.type === 'hand') {
            state.hands[state.selected.player].splice(state.selected.index, 1);
        } else {
            const sourceRow = state.selected.row;
            const sourceCol = state.selected.col;
            state.board[sourceRow][sourceCol].pop();

            // 自爆チェック
            const earlyWinner = checkWin();
            if (earlyWinner) {
                state.isGameOver = true;
                renderAll();
                playTone('win');
                setTimeout(() => showWinModal(earlyWinner), 500);
                return;
            }
        }

        const newPiece = { player: state.selected.player, size: state.selected.size };
        state.board[row][col].push(newPiece);

        if (topPiece) playTone('gobble');
        else playTone('place');

        state.selected = null;
        renderBoard();
        
        if (topPiece) {
            const cellEl = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"] .piece svg`);
            if (cellEl) cellEl.classList.add('gobble-anim');
        }
        renderHands();

        const winner = checkWin();
        if (winner) {
            state.isGameOver = true;
            playTone('win');
            setTimeout(() => showWinModal(winner), 500);
        } else {
            state.turn = (state.turn === PLAYERS.P1) ? PLAYERS.P2 : PLAYERS.P1;
            updateTurnDisplay();
            renderHands(); 
        }
    }
  }

  // --- 7. 勝敗判定 ---
  function checkWin() {
      const grid = state.board.map(row => row.map(stack => {
          return stack.length > 0 ? stack[stack.length - 1].player : null;
      }));

      const lines = [
          [[0,0],[0,1],[0,2]], [[1,0],[1,1],[1,2]], [[2,0],[2,1],[2,2]], 
          [[0,0],[1,0],[2,0]], [[0,1],[1,1],[2,1]], [[0,2],[1,2],[2,2]], 
          [[0,0],[1,1],[2,2]], [[0,2],[1,1],[2,0]]                       
      ];

      for (const line of lines) {
          const [a, b, c] = line;
          const pA = grid[a[0]][a[1]];
          const pB = grid[b[0]][b[1]];
          const pC = grid[c[0]][c[1]];

          if (pA && pA === pB && pA === pC) {
              highlightWinLine(line);
              return pA;
          }
      }
      return null;
  }

  function highlightWinLine(line) {
      line.forEach(([r, c]) => {
          const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
          if (cell) cell.classList.add('win-line');
      });
  }

  }

  function toggleSound() {
      state.soundEnabled = !state.soundEnabled;
      const btn = document.getElementById('sound-btn');
      btn.innerHTML = state.soundEnabled ? '🔊 ON' : '🔇 OFF';
      if(state.soundEnabled) playTone('select');
  }

  // --- 9. PWAインストールの管理 ---
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('install-btn');
      if (installBtn) installBtn.style.display = 'block';
  });

  window.addEventListener('appinstalled', () => {
      console.log('App installed successfully');
      const installBtn = document.getElementById('install-btn');
      if (installBtn) installBtn.style.display = 'none';
  });

  window.onload = () => {
      initGame();
      document.getElementById('rule-btn').onclick = showRules;
      document.getElementById('sound-btn').onclick = toggleSound;
      
      const installBtn = document.getElementById('install-btn');
      if (installBtn) {
          installBtn.onclick = async () => {
              if (deferredPrompt) {
                  deferredPrompt.prompt();
                  const { outcome } = await deferredPrompt.userChoice;
                  console.log(`User installation decision: ${outcome}`);
                  deferredPrompt = null;
                  installBtn.style.display = 'none';
              }
          };
      }

      document.getElementById('reset-btn').onclick = () => {
          playTone('select');
          Swal.fire({
              title: 'やりなおす？',

      };

      // サービスワーカーの登録

              .catch(err => console.error('Service Worker registration failed:', err));
      }
